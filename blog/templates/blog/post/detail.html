{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock  %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <p>
        <i>🗓️ {{ post.publish }} | автором: {{ post.author }}</i>
    </p>
    {{ post.body|linebreaks }}
    <p>
        <a href="{% url 'blog:post_share' post.id %}"><b>Поширити пост</b></a>
    </p>
{% endblock content %}
