{% extends "blog/base.html" %}

{% block title %}Додати коментар{% endblock %}

{% block content %}
    {% if comment %}
      <h2>Коментар успішно додано</h2>
      <p>
        <a href="{{ post.get_absolute_url }}">Повернутися на сторінку посту</a>
      </p>
    {% else %}
      {% include "blog/post/includes/comment_form.html" %}
    {% endif %}
{% endblock %}
